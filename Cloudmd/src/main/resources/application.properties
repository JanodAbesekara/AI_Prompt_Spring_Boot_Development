spring.application.name=article-management

# Defaults when .env / OS variables are absent. Overridden by SPRING_DATASOURCE_* (see .env) or by
# spring.datasource.* set from ArticleManagementApplication after loading .env.
spring.datasource.url=jdbc:mysql://localhost:3306/article_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
